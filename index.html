firebase.initializeApp(firebaseConfig);
const fdb = firebase.firestore();

const DB='ofertix_db';let db=JSON.parse(localStorage.getItem(DB)||'null')||{site:{name:'OFERTIX',logo:''},cats:['Todos','Eletrônicos','Casa','Moda','Beleza','Ofertas'],products:[{id:1,name:'Fone Bluetooth Premium',link:'https://mercadolivre.com.br/',price:89.9,old:129.9,cat:'Eletrônicos',ship:'Frete grátis',install:'12x de R$ 8,99',commission:5,headline:'Excelente custo-benefício',desc:'Produto demonstrativo do protótipo.',img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80',updated:Date.now()}]};let active='Todos',editId=null,slideTimer=null,slideIndex=0;db.site=db.site||{name:'OFERTIX',logo:''};db.cats=db.cats||['Todos'];db.products=db.products||[];

const save=async()=>{
  localStorage.setItem(DB,JSON.stringify(db));
  try {
    // 1. Save site metadata
    await fdb.collection('metadata').doc('site').set(db.site);
    
    // 2. Save categories
    await fdb.collection('metadata').doc('cats').set({ list: db.cats });
    
    // 3. Save products
    const batch = fdb.batch();
    db.products.forEach(p => {
      const docRef = fdb.collection('products').doc(String(p.id));
      batch.set(docRef, p);
    });
    
    // Delete orphan products from Firestore
    const snapshot = await fdb.collection('products').get();
    const activeIds = db.products.map(p => String(p.id));
    snapshot.forEach(doc => {
      if (!activeIds.includes(doc.id)) {
        batch.delete(doc.ref);
      }
    });
    
    await batch.commit();
    toast('Sincronizado com o Firebase!');
  } catch (err) {
    console.error('Firestore save failed:', err);
    toast('Erro de Sincronização: ' + err.message);
  }
};

async function syncFromCloud() {
  try {
    const siteDoc = await fdb.collection('metadata').doc('site').get();
    const catsDoc = await fdb.collection('metadata').doc('cats').get();
    const productsSnapshot = await fdb.collection('products').get();
    
    // Auto-seed if database is brand new
    if (!siteDoc.exists && !catsDoc.exists && productsSnapshot.empty) {
      console.log('Novo Firebase vazio. Semeando estado inicial...');
      await save();
      return;
    }
    
    const site = siteDoc.exists ? siteDoc.data() : { name: 'OFERTIX', logo: '' };
    const cats = catsDoc.exists ? catsDoc.data().list : ['Todos', 'Eletrônicos', 'Casa', 'Moda', 'Beleza', 'Ofertas'];
    const products = [];
    productsSnapshot.forEach(doc => {
      products.push(doc.data());
    });
    
    db = { site, cats, products };
    localStorage.setItem(DB, JSON.stringify(db));
    renderBrand();
    renderCats();
    render();
    if (admin.style.display === 'block') buildAdmin();
  } catch (err) {
    console.error('Firestore sync failed:', err);
  }
}

function renderBrand(){
  const el=document.getElementById('siteLogo');
  if(!el)return;
  if(db.site.logo) el.innerHTML=`<img src="${esc(db.site.logo)}" alt="${esc(db.site.name||'Logo')}" style="max-height:42px;max-width:220px;object-fit:contain">`;
  else el.textContent=db.site.name||'OFERTIX';
}
function renderCarousel(){
  const c=document.getElementById('carousel');
  if(!c)return;
  if(!SLIDES.length){c.style.display='none';return;}
  c.style.display='block';
  c.innerHTML=`<div class="slides" id="slidesTrack">${SLIDES.map((src,i)=>`<div class="slide"><img src="${src}" alt="Slide ${i+1}"></div>`).join('')}</div>
    <button class="slide-btn prev" onclick="moveSlide(-1)" aria-label="Anterior">‹</button>
    <button class="slide-btn next" onclick="moveSlide(1)" aria-label="Próximo">›</button>
    <div class="dots">${SLIDES.map((_,i)=>`<button class="dot ${i===0?'on':''}" onclick="goSlide(${i})" aria-label="Ir para slide ${i+1}"></button>`).join('')}</div>`;
  slideIndex=0; updateSlide();
  clearInterval(slideTimer);
  slideTimer=setInterval(()=>moveSlide(1),5000);
}
function updateSlide(){
  const track=document.getElementById('slidesTrack');
  if(!track)return;
  track.style.transform=`translateX(-${slideIndex*100}%)`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===slideIndex));
}
function goSlide(i){slideIndex=(i+SLIDES.length)%SLIDES.length;updateSlide();}
function moveSlide(d){goSlide(slideIndex+d);}
function saveSite(){
  const f=new FormData(document.getElementById('siteForm'));
  const file=document.getElementById('siteLogoFile').files[0];
  const finish=(logo)=>{db.site={name:(f.get('siteName')||'OFERTIX').trim()||'OFERTIX',logo:logo||''};save();renderBrand();buildAdmin();toast('Identidade do site salva.');};
  if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file);}
  else finish(f.get('logoUrl')||db.site.logo);
}
function renderCats(){cats.innerHTML=db.cats.map(c=>`<button class="cat ${active===c?'on':''}" onclick="active=${JSON.stringify(c)};renderCats();render()">${esc(c)}</button>`).join('')}
function render(){let q=search.value.toLowerCase(),arr=db.products.filter(p=>(active==='Todos'||p.cat===active)&&(!q||JSON.stringify(p).toLowerCase().includes(q))).sort((a,b)=>b.updated-a.updated);products.innerHTML=arr.length?arr.map(p=>`<article class="card"><div class="pic"><img src="${esc(p.img)}" onerror="this.style.display='none'"></div><div class="info"><div class="name">${esc(p.name)}</div>${p.old?`<div class="old">${money(p.old)}</div>`:''}<div class="price">${money(p.price)}</div>${p.install?`<div class="install">${esc(p.install)}</div>`:''}${p.ship?`<span class="ship">${esc(p.ship)}</span>`:''}<div class="headline">${esc(p.headline)}</div><button class="buy" onclick="window.open('${esc(p.link)}','_blank')">Ver oferta</button></div></article>`).join(''):'<div class="empty">Nenhum achadinho encontrado.</div>'}
function toast(t){toastEl=document.getElementById('toast');toastEl.textContent=t;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',2000)}
function adminOpen(){if(new URLSearchParams(location.search).get('admin')!=='true')return;let p=prompt('Senha de administrador:');if(p!=='ofertix2026')return alert('Senha incorreta.');buildAdmin();admin.style.display='block'}
function field(l,n,v='',type='text',extra=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}" ${extra}></div>`}
function buildAdmin(){let p=db.products.find(x=>x.id===editId)||{};admin.innerHTML=`<div class="modal"><button class="close" onclick="admin.style.display='none'">Fechar</button><h2>Painel de administração</h2>
<h3>Identidade do site</h3>
<form id="siteForm" onsubmit="event.preventDefault();saveSite()">
<div class="form">
<div class="field"><label>Nome do site</label><input name="siteName" value="${esc(db.site.name||'OFERTIX')}" maxlength="60"></div>
<div class="field"><label>Logo PNG por link (opcional)</label><input name="logoUrl" type="url" value="${esc(db.site.logo&&db.site.logo.startsWith('data:')?'':db.site.logo)}" placeholder="https://.../logo.png"></div>
<div class="field full"><label>Enviar logo PNG</label><input id="siteLogoFile" type="file" accept="image/png"></div>
</div>
<div class="brand-preview">${db.site.logo?`<img src="${esc(db.site.logo)}" alt="Logo atual">`:`<span class="brand-text">${esc(db.site.name||'OFERTIX')}</span>`}</div>
<div class="actions"><button class="btn primary">Salvar identidade</button><button type="button" class="btn gray" onclick="db.site={name:'OFERTIX',logo:''};save();renderBrand();buildAdmin();">Restaurar padrão</button></div>

${i},-1)">←</button><button onclick="moveCat(${i},1)">→</button><button onclick="delCat(${JSON.stringify(c)})">×</button></div>`).join('')}</div><div class="actions"><input id="newcat" placeholder="Nova categoria" style="padding:10px;border:1px solid #ccc;border-radius:6px"><button class="btn primary" onclick="addCat()">Adicionar categoria</button></div><hr><h3>Importar banco de dados Access / Excel (CSV)</h3><div class="field full" style="background:#fcfcfc;border:1px dashed #bbb;padding:16px;border-radius:8px;"><p style="margin:0 0 12px;font-size:13px;color:#555;line-height:1.4;">Como o seu site agora está na nuvem para que outros acessem de qualquer computador, ele não consegue abrir arquivos locais diretamente da sua máquina (como <code>C:\\Users\\Admin\\Documents\\ofetix.accdb</code>).<br><br><strong>Como transferir seus produtos:</strong> No MS Access, clique com o botão direito na sua tabela de produtos, escolha <strong>Exportar &gt; Arquivo de Texto</strong>, salve como <strong>.csv</strong> (separado por vírgula ou ponto-e-vírgula) e envie o arquivo abaixo para sincronizar tudo instantaneamente!</p><input type="file" id="csvFile" accept=".csv,.txt" style="display:none;" onchange="importCSV(event)"><button type="button" class="btn primary" onclick="document.getElementById('csvFile').click()">Selecionar arquivo CSV do Access</button><span id="importStatus" style="margin-left:12px;font-size:13px;font-weight:bold;color:var(--green);"></span></div></div>`}
async function submitP(e){e.preventDefault();let f=new FormData(e.target),img=f.get('img')||'',file=document.getElementById('file').files[0];if(file)img=await new Promise(r=>{let a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(file)});let p={id:editId||Date.now(),name:f.get('name'),link:f.get('link'),price:+f.get('price'),old:+f.get('old'),cat:f.get('cat'),ship:f.get('ship'),install:f.get('install'),commission:+f.get('commission'),headline:f.get('headline'),desc:f.get('desc'),img,updated:Date.now()};db.products=editId?db.products.map(x=>x.id===editId?p:x):[...db.products,p];save();editId=null;buildAdmin();render();toast('Produto salvo.')}
function editP(id){editId=id;buildAdmin()}function renew(id){db.products=db.products.map(p=>p.id===id?{...p,updated:Date.now()}:p);save();buildAdmin();render();toast('Produto renovado e colocado em primeiro.')}function delP(id){if(confirm('Excluir este produto?')){db.products=db.products.filter(p=>p.id!==id);save();buildAdmin();render()}}
function addCat(){let x=newcat.value.trim();if(!x||db.cats.includes(x))return;db.cats.push(x);save();buildAdmin();renderCats()}function delCat(c){if(db.products.some(p=>p.cat===c))return alert('A categoria possui produtos. Mova-os antes de excluir.');db.cats=db.cats.filter(x=>x!==c);save();buildAdmin();renderCats()}function moveCat(i,d){let a=db.cats.filter(x=>x!=='Todos'),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];db.cats=['Todos',...a];save();buildAdmin();renderCats()}
function parseCSV(text) {
  let lines = text.split(/\r?\n/);
  if (lines.length === 0) return [];
  let firstLine = lines[0];
  let sep = ',';
  if ((firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length) {
    sep = ';';
  }
  let headers = firstLine.split(sep).map(h => h.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
  
  let nameIdx = headers.findIndex(h => h.includes('nome') || h.includes('name') || h.includes('titulo') || h.includes('produto'));
  let linkIdx = headers.findIndex(h => h.includes('link') || h.includes('url'));
  let priceIdx = headers.findIndex(h => h.includes('preco') || h.includes('price') || h.includes('valor') || h.includes('atual') || h.includes('venda'));
  let oldIdx = headers.findIndex(h => h.includes('old') || h.includes('antigo') || h.includes('original') || h.includes('de'));
  let catIdx = headers.findIndex(h => h.includes('cat') || h.includes('categoria') || h.includes('grupo'));
  let shipIdx = headers.findIndex(h => h.includes('ship') || h.includes('frete') || h.includes('entrega'));
  let installIdx = headers.findIndex(h => h.includes('install') || h.includes('parc') || h.includes('vezes') || h.includes('pagamento'));
  let commIdx = headers.findIndex(h => h.includes('comis') || h.includes('commission') || h.includes('ganho'));
  let headlineIdx = headers.findIndex(h => h.includes('head') || h.includes('chamada') || h.includes('frase') || h.includes('subtitulo'));
  let descIdx = headers.findIndex(h => h.includes('desc') || h.includes('detalhe') || h.includes('texto'));
  let imgIdx = headers.findIndex(h => h.includes('img') || h.includes('foto') || h.includes('imagem'));

  if (nameIdx === -1) nameIdx = 0;
  if (priceIdx === -1 && headers.length > 1) priceIdx = 1;
  if (linkIdx === -1 && headers.length > 2) linkIdx = 2;

  let importedProducts = [];
  for (let i = 1; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    
    let cols = [];
    let inQuotes = false;
    let current = '';
    for (let j = 0; j < line.length; j++) {
      let char = line[j];
      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === sep && !inQuotes) {
        cols.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    cols.push(current.trim());

    if (cols.length < 1 || !cols[nameIdx]) continue;

    const parsePrice = (val) => {
      if (!val) return 0;
      val = val.replace('R$', '').replace(/\s/g, '').trim();
      if (val.includes(',') && val.includes('.')) {
        val = val.replace(/\./g, '').replace(',', '.');
      } else if (val.includes(',')) {
        val = val.replace(',', '.');
      }
      return parseFloat(val) || 0;
    };

    let p = {
      id: Date.now() + i,
      name: cols[nameIdx] || '',
      link: linkIdx !== -1 && cols[linkIdx] ? cols[linkIdx] : 'https://mercadolivre.com.br/',
      price: priceIdx !== -1 ? parsePrice(cols[priceIdx]) : 0,
      old: oldIdx !== -1 ? parsePrice(cols[oldIdx]) : 0,
      cat: catIdx !== -1 && cols[catIdx] ? cols[catIdx] : 'Todos',
      ship: shipIdx !== -1 ? cols[shipIdx] : '',
      install: installIdx !== -1 ? cols[installIdx] : '',
      commission: commIdx !== -1 ? parseFloat(cols[commIdx]) || 0 : 0,
      headline: headlineIdx !== -1 ? cols[headlineIdx] : '',
      desc: descIdx !== -1 ? cols[descIdx] : '',
      img: imgIdx !== -1 && cols[imgIdx] ? cols[imgIdx] : 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80',
      updated: Date.now()
    };

    if (p.cat && p.cat !== 'Todos' && !db.cats.includes(p.cat)) {
      db.cats.push(p.cat);
    }
    importedProducts.push(p);
  }
  return importedProducts;
}

async function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('importStatus');
  statusEl.textContent = 'Lendo arquivo...';
  
  const reader = new FileReader();
  reader.onload = async function() {
    try {
      const text = reader.result;
      const products = parseCSV(text);
      if (products.length === 0) {
        statusEl.textContent = 'Nenhum produto válido encontrado no CSV.';
        return;
      }
      db.products = [...db.products, ...products];
      statusEl.textContent = `Sincronizando ${products.length} produtos na nuvem...`;
      await save();
      buildAdmin();
      renderCats();
      render();
      statusEl.textContent = `Sucesso! ${products.length} produtos importados e sincronizados na nuvem!`;
      toast(`${products.length} produtos importados!`);
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Erro ao processar o CSV.';
    }
  };
  reader.readAsText(file, 'utf-8');
}
